<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SafeGround: hazard readiness and response planning for any place on Earth.">
  <meta name="color-scheme" content="dark light">
  <title>SafeGround · Hazard readiness and response planning for any place on Earth</title>
  <script>
    try { const t = localStorage.getItem("sg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked: stay dark-first */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233466F0'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 23.5s-7-5.9-7-11.7a7 7 0 0 1 14 0c0 5.8-7 11.7-7 11.7z'/%3E%3Cpath d='m13 11.9 2.1 2.1 3.9-4'/%3E%3Cpath d='M8 27h16'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/h3-js@4.4.0/dist/h3-js.umd.js"></script>
  <script src="https://unpkg.com/deck.gl@9.3.11/dist.min.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="SafeGround home">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 18.5s-5.5-4.6-5.5-9.2a5.5 5.5 0 0 1 11 0c0 4.6-5.5 9.2-5.5 9.2z"/><path d="m9.7 9.4 1.6 1.6 3-3.1"/><path d="M5 21.5h14"/></svg></span>
    <span class="brand-name">SafeGround</span>
  </a>
  <nav class="ws-tabs" id="wsTabs" aria-label="Workspace" hidden>
    <a class="ws-tab" data-view="overview" href="#">Overview</a>
    <a class="ws-tab" data-view="readiness" href="#">Readiness</a>
    <a class="ws-tab" data-view="simulate" href="#">Simulate</a>
  </nav>
  <nav class="top-links" id="topLinks" aria-label="About SafeGround">
    <a href="#/methodology">Methodology</a><a href="#/sources">Data &amp; Sources</a><a href="#/limitations">Limitations</a>
  </nav>
  <div class="top-search search" id="topSearch" role="search" hidden>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <label class="sr-only" for="placeSearch">Search a place</label>
    <input id="placeSearch" class="place-input" type="search" placeholder="Search a place or enter coordinates" autocomplete="off" aria-controls="placeResults" aria-autocomplete="list">
    <div class="results" id="placeResults" role="listbox" aria-label="Places" hidden></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to light theme"></button>
    <button class="icon-btn" id="helpBtn" type="button" aria-label="Help"></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Landing page -->
  <section id="landing" class="landing" hidden aria-labelledby="landingTitle"></section>

  <!-- Workspace: controls | map | results -->
  <section id="workspace" class="ws" hidden>
    <h1 class="sr-only" id="wsTitle">SafeGround workspace</h1>
    <aside class="ws-left" id="leftPanel" aria-label="Controls"></aside>
    <section class="ws-map" aria-label="Map">
      <div id="map" role="application" aria-label="Interactive map. Use the controls panel to set locations by coordinates if you cannot use a pointer."></div>
      <div class="map-hint" id="coach" role="status" aria-live="polite" hidden><span class="dot" aria-hidden="true"></span><span id="coachText"></span></div>
      <div class="map-pop" id="mapPop" hidden></div>
      <div class="layer-ctl" id="layerCtl"></div>
      <div class="map-ctrl" role="group" aria-label="Map controls">
        <button id="zoomIn" type="button" aria-label="Zoom in"></button>
        <button id="zoomOut" type="button" aria-label="Zoom out"></button>
        <button id="toggle3d" type="button" class="on" aria-pressed="true" aria-label="3D view">3D</button>
        <button id="locateBtn" type="button" aria-label="Use my location"></button>
      </div>
      <div class="legend" id="legend" hidden></div>
    </section>
    <aside class="ws-drawer" id="drawer" aria-label="Results" aria-live="polite"></aside>
  </section>

  <!-- Methodology, sources, limitations, accessibility -->
  <article id="docPage" class="doc" hidden></article>
</main>

<footer class="disclaimer" role="contentinfo">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
  <span>SafeGround is a planning and training tool. In a real emergency, follow authorities and call your local emergency number.</span>
</footer>

<dialog id="helpDlg" class="dialog" aria-labelledby="helpTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="printRoot" class="print-root"></div>

<script src="/static/app.js"></script>
</body>
</html>
