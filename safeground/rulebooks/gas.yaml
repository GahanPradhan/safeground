hazard: gas
title: Toxic gas leak
group: industrial
sources:
  erg124: {title: "Emergency Response Guidebook 2024, Guide 124 (Gases - Toxic and/or Corrosive - Oxidizing)", url: "https://cameochemicals.noaa.gov/erg_guides/en/Guide_124.pdf"}
  erg125: {title: "Emergency Response Guidebook 2024, Guide 125 (Gases - Toxic and/or Corrosive)", url: "https://cameochemicals.noaa.gov/erg_guides/en/Guide_125.pdf"}
  erg_un1005: {title: "ERG 2024 Table 1 & 3 — UN1005 Ammonia, anhydrous (NOAA CAMEO Chemicals)", url: "https://cameochemicals.noaa.gov/unna/1005"}
  erg_un1017: {title: "ERG 2024 Table 1 & 3 — UN1017 Chlorine (NOAA CAMEO Chemicals)", url: "https://cameochemicals.noaa.gov/unna/1017"}
  ready_chemical: {title: "Ready.gov (US FEMA) — Chemical Emergencies", url: "https://www.ready.gov/chemical"}
caveats:
  - "ERG distances are designed for the first 30 minutes of transport incidents; for fixed facilities they are a screening estimate, not a dispersion model."
  - "Day/night uses 06:00–18:00 local time as an approximation of sunrise–sunset."
  - "The yellow band (±22.5° around the wind direction) is a SafeGround buffer for wind uncertainty, not an ERG distance."

zone_model:
  type: wind_plume
  # ERG: first isolate in all directions (circle), then protect downwind (square zone whose
  # length and width equal the protective-action distance, starting at the source).
  wind_classes_ms: {low: [0, 2.68], moderate: [2.68, 5.36], high: [5.36, 99]}  # <6 mph, 6–12 mph, >12 mph
  uncertainty_deg: 22.5
  chemicals:
    ammonia:
      un: "1005"
      guide: erg125
      table_source: erg_un1005
      small: {isolate_ft: 100, day_mi: 0.1, night_mi: 0.1}
      large:  # Table 3: isolate_ft, day [low, moderate, high] mi, night [low, moderate, high] mi
        rail_tank_car: {isolate_ft: 1000, day_mi: [1.0, 0.8, 0.6], night_mi: [2.6, 1.3, 0.8]}
        highway_tank_truck: {isolate_ft: 500, day_mi: [0.5, 0.3, 0.3], night_mi: [1.1, 0.4, 0.4]}
        agricultural_nurse_tank: {isolate_ft: 200, day_mi: [0.3, 0.2, 0.2], night_mi: [0.9, 0.2, 0.2]}
        multiple_small_cylinders: {isolate_ft: 100, day_mi: [0.2, 0.1, 0.1], night_mi: [0.5, 0.2, 0.1]}
    chlorine:
      un: "1017"
      guide: erg124
      table_source: erg_un1017
      small: {isolate_ft: 200, day_mi: 0.2, night_mi: 0.9}
      large:
        rail_tank_car: {isolate_ft: 3000, day_mi: [6.0, 3.9, 3.2], night_mi: [7.0, 5.6, 4.1]}  # night low wind is "7.0+"
        highway_tank_truck: {isolate_ft: 2000, day_mi: [3.5, 2.1, 1.6], night_mi: [4.0, 2.9, 2.4]}
        multiple_ton_cylinders: {isolate_ft: 1000, day_mi: [1.2, 0.8, 0.6], night_mi: [2.2, 1.4, 0.8]}
        multiple_small_cylinders: {isolate_ft: 500, day_mi: [0.9, 0.5, 0.3], night_mi: [1.5, 0.8, 0.4]}

params:
  - {key: chemical, label: "Chemical", type: select, default: ammonia, options: [[ammonia, "Ammonia (UN1005)"], [chlorine, "Chlorine (UN1017)"]]}
  - {key: size, label: "Leak size", type: select, default: rail_tank_car, options: [[small, "Small spill"], [rail_tank_car, "Rail tank car"], [highway_tank_truck, "Highway tank truck"], [multiple_small_cylinders, "Several small cylinders"]]}
  - {key: wind, label: "Wind", type: wind, default_from: 90, default_speed: 2}
  - {key: local_hour, label: "Time", type: choice, default: 0, options: [[0, "Night"], [12, "Day"]]}

tiers:
  red: "Initial isolation zone (all directions around the source)"
  orange: "Protective action zone (downwind of the source)"
  yellow: "Wind-uncertainty band next to the protective action zone"
  green: "Outside the computed zones"

moves:
  red: [MOVE_CROSSWIND_UPWIND, STAY_IN_SEAL]
  orange: [STAY_IN_SEAL, MOVE_CROSSWIND_UPWIND]
  yellow: [STAY_ALERT, STAY_IN_SEAL]
  green: [STAY_ALERT]
  forbidden: [GO_DOWN, MOVE_DOWNWIND, APPROACH_SOURCE, ENTER_ZONE]

advice:
  - {id: gas.upwind, source: erg125, text: "Stay upwind, uphill and/or upstream.", tiers: [red, orange, yellow, green], situations: [all]}
  - {id: gas.low_areas, source: erg125, text: "Many gases are heavier than air and will spread along the ground and collect in low or confined areas (sewers, basements, tanks, etc.).", tiers: [red, orange, yellow], situations: [all]}
  - {id: gas.keep_away, source: erg125, text: "Keep unauthorized personnel away.", tiers: [red, orange], situations: [all]}
  - {id: gas.no_touch, source: erg125, text: "Do not touch or walk through spilled material.", tiers: [red, orange], situations: [outdoors, vehicle, needs_assistance]}
  - {id: gas.outdoor_clean_air, source: ready_chemical, text: "Quickly decide what is the fastest way to find clean air. Move away immediately, in a direction upwind of the source.", tiers: [red, orange], situations: [outdoors, needs_assistance]}
  - {id: gas.outdoor_nearest_building, source: ready_chemical, text: "Find the closest building to shelter-in-place.", tiers: [red, orange, yellow], situations: [outdoors, needs_assistance]}
  - {id: gas.indoor_room, source: ready_chemical, text: "Seek shelter in an internal room. Close and lock all exterior doors and windows.", tiers: [red, orange, yellow], situations: [home_ground, home_upper, institution, needs_assistance]}
  - {id: gas.indoor_vents, source: ready_chemical, text: "Close vents, fireplace dampers and as many interior doors as possible. Seal the room with duct tape and plastic sheeting.", tiers: [red, orange], situations: [home_ground, home_upper, institution, needs_assistance]}
  - {id: gas.indoor_ac, source: ready_chemical, text: "Turn off air conditioners and ventilation systems, or set ventilation systems to 100 percent recirculation", tiers: [red, orange, yellow], situations: [home_ground, home_upper, institution, needs_assistance]}
  - {id: gas.indoor_breathe, source: ready_chemical, text: "Take shallow breaths through a cloth or a towel if gas or vapors could have entered the building.", tiers: [red, orange], situations: [home_ground, home_upper, institution, needs_assistance]}
  - {id: gas.pets, source: ready_chemical, text: "Bring pets inside.", tiers: [red, orange, yellow], situations: [home_ground, home_upper]}
  - {id: gas.food, source: ready_chemical, text: "Avoid eating or drinking any food or water that may be contaminated.", tiers: [red, orange], situations: [all]}
  - {id: gas.vehicle, source: ready_chemical, text: "If in a car, keep car windows and vents closed and shut off the air conditioner and heater.", tiers: [red, orange, yellow], situations: [vehicle]}
  - {id: gas.evacuate_now, source: ready_chemical, text: "If asked to evacuate, do so immediately.", tiers: [red, orange, yellow], situations: [all]}
  - {id: gas.inside_building_leak, source: ready_chemical, text: "If the chemical is inside your building, get out of the building without passing through the contaminated area", tiers: [red, orange], situations: [home_ground, home_upper, institution]}
  - {id: gas.trapped, source: ready_chemical, text: "If you can't get out of the building or find clean air without passing through the affected area, move as far away as possible and shelter-in-place.", tiers: [red, orange], situations: [home_ground, home_upper, institution, needs_assistance]}
