"Ennore":
  - type: gas leak (ammonia)
    date: "2023-12-26"
    what_happened: "Ammonia leaked from Coromandel International's subsea pipeline near Periyakuppam and Chinnakuppam around 11:45 pm; the pollution board told the NGT that 67.638 tonnes leaked."
    url: "https://thenewsminute.com/amp/story/tamil-nadu/ennore-gas-leak-tnpcb-says-67-tonnes-of-ammonia-leaked-from-coromandel"
  - type: gas leak (ammonia)
    date: "2023-12-27"
    what_happened: "Residents fled their homes in the early hours after the ammonia leak; dozens were hospitalised."
    url: "https://www.dtnext.in/news/chennai/panic-in-ennore-as-ammonia-gas-leak-756957"
