    date: "2024"
    what_happened: "A Tamil Nadu government technical committee said Cyclone Michaung could have damaged the ammonia pipeline that leaked."
    url: "https://www.thenewsminute.com/amp/story/tamil-nadu/ennore-gas-leak-tn-govt-report-says-cyclone-could-have-damaged-cil-ammonia-pipeline"
