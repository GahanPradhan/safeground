"Velachery":
  - type: flood
    date: "2023-12-05"
    what_happened: "During Cyclone Michaung, most residential neighbourhoods in Velachery had about four feet of water and residents were forced to evacuate; they said little had changed since 2015."
    url: "https://www.thenewsminute.com/amp/story/tamil-nadu/chennai-floods-velachery-residents-forced-to-evacuate-say-little-has-changed-since-2015"
  - type: flood
    date: "2023-12-09"
    what_happened: "Inter-agency situation report: Velachery and Perungudi were among areas still underwater five days after Cyclone Michaung."
    url: "https://www.sphereindia.org.in/sites/default/files/2023-12/SitRep3_CycloneMichaung_09-12-23.pdf"
  - type: flood
    date: "2015-12"
    what_happened: "Velachery, Pallikaranai and Thoraipakkam were among the worst-hit areas in the December 2015 Chennai floods; reporters cite experts linking this to wetlands converted to real estate."
    url: "https://www.thequint.com/india/2016/07/11/more-wetlands-vanish-as-chennai-refuses-to-learn-from-2015-floods"
  - type: wetland loss
    date: "2016"
    what_happened: "Report on continued filling of the Pallikaranai marsh for construction after the 2015 floods."
    url: "https://www.thenewsminute.com/tamil-nadu/swallowing-pallikaranai-marsh-chennaiites-are-refusing-learn-2015-floods-46251"
